loader:
  _target_: topobench.data.loaders.BrainConnectomeDatasetLoader
  parameters:
    data_domain: graph
    data_type: BrainConnectome
    data_name: brain_pnc_community
    data_dir: ${paths.data_dir}/${dataset.loader.parameters.data_domain}/${dataset.loader.parameters.data_type}
    # ABSOLUTE path to the harness npz cache (override per run / feature mode):
    cache_dir: /home/compa/Documents/working_dir/TopoBenchChallenge/data/cache/brain_pnc_community

# Dataset parameters
parameters:
  num_features: 6           # local_stats feature count (override to 400 for identity_leak)
  num_classes: 7            # Yeo-7 networks
  task: classification
  loss_type: cross_entropy
  monitor_metric: accuracy
  task_level: node

# splits — inductive across subjects.
# NOTE: both the processed lifting cache (keyed by data_name) and the split dir
# (namespaced by data_name below) are keyed by data_name, NOT by the npz content.
# So EACH logical variant (honest / identity-leak / label-shuffle / full-cohort)
# MUST be run with a distinct dataset.loader.parameters.data_name override, or it
# will silently reuse another variant's cached complex + split.
split_params:
  learning_setting: inductive
  data_split_dir: ${dataset.loader.parameters.data_dir}/data_splits/${dataset.loader.parameters.data_name}
  data_seed: 0
  split_type: random
  k: 10
  train_prop: 0.7

# Dataloader parameters
dataloader_params:
  # batch_size MUST be 1: MPSN densifies the batched edge x triangle incidence
  # matrix (mpsn.py _to_dense), and a batched block-diagonal densifies to
  # (B*edges) x (B*triangles) -- a batch^2 blow-up. Dense brain FC has ~11k
  # triangles/graph, so batch=16 tried to allocate ~39 GiB (OOM). At batch=1 the
  # simplicial complex fits in <1 GB. Do not raise without checking GPU memory.
  batch_size: 1
  num_workers: 0
  pin_memory: False
