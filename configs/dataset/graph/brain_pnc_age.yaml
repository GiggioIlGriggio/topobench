# Graph-level AGE regression on PNC connectomes (research track, exp 0009).
# Mirrors brain_pnc_community.yaml's loader/cache/split structure but is graph-level
# regression (age in YEARS). Run each (modality x feature) variant with a DISTINCT
# data_name + cache_dir override (both the processed-lift cache and the split dir are
# keyed by data_name). Defaults below = the FC-identity variant.
loader:
  _target_: topobench.data.loaders.BrainConnectomeDatasetLoader
  parameters:
    data_domain: graph
    data_type: BrainConnectome
    data_name: brain_pnc_age_fc_identity
    y_dtype: float          # regression target (Task 6)
    data_dir: ${paths.data_dir}/${dataset.loader.parameters.data_domain}/${dataset.loader.parameters.data_type}
    cache_dir: /home/compa/Documents/working_dir/TopoBenchChallenge/data/cache/brain_pnc_age_fc_identity

parameters:
  num_features: 400         # identity one-hot (eye(400)) and profile (top-k row) are both 400-dim
  num_classes: 1
  task: regression
  loss_type: mse
  monitor_metric: mae
  task_level: graph
  metrics: [mae, mse, r2]   # MAE (years), MSE, R^2 — Pearson not registered in the fork

split_params:
  learning_setting: inductive
  data_split_dir: ${dataset.loader.parameters.data_dir}/data_splits/${dataset.loader.parameters.data_name}
  data_seed: 0
  split_type: random
  k: 10
  train_prop: 0.7

dataloader_params:
  # Default 1 for the MPSN batch^2 constraint (see brain_pnc_community.yaml). GCN runs
  # override dataset.dataloader_params.batch_size=32 on the CLI.
  batch_size: 1
  num_workers: 0
  pin_memory: False
